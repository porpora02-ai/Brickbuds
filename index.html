<!DOCTYPE html>
<html>

<head>

    <title>Brickbuds</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="overlay">

    <div class="left">

        <h1>Join Brickbuds</h1>

        <p>
            Build games, explore worlds,
            and meet players!
        </p>

    </div>

    <div class="login-box">

        <h2>Create Account</h2>

        <input type="text"
        id="username"
        placeholder="Username">

        <input type="email"
        id="email"
        placeholder="Email">

        <input type="password"
        id="password"
        placeholder="Password">

        <button onclick="register()">
            Sign Up
        </button>

        <button onclick="login()">
            Login
        </button>

        <p id="message"></p>

    </div>

</div>

<script src="app.js"></script>

</body>
</html>
